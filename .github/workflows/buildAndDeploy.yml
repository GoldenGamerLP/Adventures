name: Build and Upload Artifacts
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        uses: oven-sh/setup-bun@v2
        run: bun install

      - name: Build project
        run: bun run build

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          path: .output
